
# Nginx configuration for Undangan Wedding Invitation
# Optimized for 50+ concurrent users, static file serving, SPA routing support

user root;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer settings
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 10m;
    large_client_header_buffers 4 8k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/x-javascript
        application/x-web-app-manifest+json
        font/woff
        font/woff2
        font/ttf
        font/otf
        image/svg+xml;

    # Rate limiting terarah: hanya endpoint tulis yang dibatasi.
    # GET konten/komentar sengaja TIDAK dibatasi agar tamu di balik CGNAT
    # (banyak tamu satu IP operator) tidak saling menendang.
    limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=cmt:10m rate=2r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    server {
        listen 3000;
        listen [::]:3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Header keamanan (satu sumber: snippet, supaya tidak hilang
        # ketika sebuah location punya add_header sendiri).
        include /etc/nginx/security-headers.conf;

        # Connection limiting
        limit_conn conn 100;

        # Bundel JS/CSS tanpa hash nama file -> jangan di-cache lama,
        # supaya update aplikasi langsung terpakai oleh pengunjung lama.
        location ~* \.(js|css)$ {
            expires -1;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri =404;
        }

        # Static assets with aggressive caching
        location ~* \.(css|js|woff|woff2|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg|mp4|webm|ogg|mp3|wav)$ {
            expires 1y;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
            try_files $uri =404;
        }

        # HTML files - no cache, always revalidate
        location ~* \.html$ {
            expires -1;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            try_files $uri =404;
        }

        # Login: batasi percobaan per IP (brute force). 6/menit, burst 3.
        location = /api/session {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream undangan-nginx:8080;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 64m;
            proxy_buffering off;
            limit_req zone=login burst=3 nodelay;
        }

        # Kirim komentar/RSVP: 2/detik per IP, burst 8 (aman untuk CGNAT).
        location = /api/comment {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream undangan-nginx:8080;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 64m;
            proxy_buffering off;
            limit_req zone=cmt burst=8 nodelay;
        }

        # API reverse proxy (same-origin) -> undangan-api nginx
        # Upstream pakai variable + resolver supaya nginx tetap start
        # walau container API (undangan-nginx) belum/tidak berjalan.
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream undangan-nginx:8080;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 64m;
            proxy_buffering off;
        }

        # SPA routing support - fallback to index.html for non-asset routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Dashboard komentar (bawaan template)
        # dashboard.html (dashboard template lama) sudah dihapus.
        # Path lama jangan diam-diam menampilkan undangan.
        location = /dashboard {
            return 404;
        }

        # Studio Undangan (CMS admin)
        location = /admin {
            try_files /admin.html =404;
        }

        location ^~ /admin/ {
            try_files $uri /admin.html =404;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            include /etc/nginx/security-headers.conf;
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to backup/config files
        location ~* \.(bak|conf|config|dist|env|ini|log|sql|tar|gz|zip)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
