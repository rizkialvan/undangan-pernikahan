services:
  undangan:
    build:
      context: .
      dockerfile: Dockerfile
      # Build args for optimization
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: undangan-pernikahan
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - undangan-network
      - undangan-shared
    # Resource limits for 50+ concurrent users
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    # Health check (also defined in Dockerfile)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  undangan-network:
    driver: bridge
    name: undangan-network
    enable_ipv6: false
  undangan-shared:
    external: true

# No volumes needed for static site - all content baked into image
# If persistent data needed in future, add volumes here