services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: undangan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: undangan
      POSTGRES_USER: undangan_user
      POSTGRES_PASSWORD: "${DB_PASS}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - undangan-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undangan_user -d undangan"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      secrets:
        - env
    container_name: undangan-app
    restart: unless-stopped
    environment:
      APP_NAME: "Kamu"
      APP_KEY: "${APP_KEY}"
      BASEURL: "${BASEURL}"
      DEBUG: "false"
      LOG: "false"
      DB_DRIV: "pgsql"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "undangan"
      DB_USER: "undangan_user"
      DB_PASS: "${DB_PASS}"
      JWT_EXP: "3600"
      JWT_KEY: "${JWT_KEY}"
      WA_GATEWAY_URL: "${WA_GATEWAY_URL}"
      WA_TOKEN: "${WA_TOKEN}"
    volumes:
      - ./storage:/var/www/storage
    networks:
      - undangan-backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "saya", "about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Nginx Reverse Proxy (unprivileged)
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: undangan-nginx
    restart: unless-stopped
    ports:
      - "3001:8080"
    volumes:
      - ./storage/uploads:/srv/media:ro
    networks:
      - undangan-backend
      - undangan-shared
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
    driver: local

networks:
  undangan-backend:
    driver: bridge
    name: undangan-backend
    enable_ipv6: false
  undangan-shared:
    external: true

secrets:
  env:
    file: .env
