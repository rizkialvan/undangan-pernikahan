server {
    listen 8080;
    server_name localhost 127.0.0.1;
    index index.php;

    # upload media CMS (foto/audio/video)
    client_max_body_size 64m;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    root /var/www/public;

    charset utf-8;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    # Media undangan: dilayani langsung nginx dari volume read-only.
    # Hanya bisa diakses lewat X-Accel-Redirect dari PHP (internal).
    location /_media/ {
        internal;
        alias /srv/media/;
        sendfile on;
        tcp_nopush on;
    }

    location ~ \.php$ {
        # Resolve ulang nama container tiap 10 detik: tanpa ini nginx memakai
        # IP app dari saat start, dan setiap recreate container app -> 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}