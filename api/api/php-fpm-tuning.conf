; Override pool www — dimuat setelah www.conf (prefiks zz-).
; 8 worker: 512M lama hanya sanggup 5 worker pada ~45 MB/worker.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
; 300s, bukan 30s: upload video 40 MB di 2 Mbps butuh ~160 detik.
request_terminate_timeout = 300s
