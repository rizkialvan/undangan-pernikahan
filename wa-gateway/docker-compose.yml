name: undangan-wa

services:
  gateway:
    build:
      context: ./src
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: wa-gateway
    env_file: .env
    environment:
      PORT: "8099"
      TZ: Asia/Jakarta
      WA_AUTH_DIR: /data/auth
    volumes:
      - ./data/auth:/data/auth
    networks:
      - undangan-backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8099/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  undangan-backend:
    external: true